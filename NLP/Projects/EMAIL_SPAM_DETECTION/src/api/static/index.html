<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061535">
  <title>Email Spam Detection</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #061535;
      color: #edf4ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(ellipse at 50% 0, #102757 0, #07183b 42%, #04112b 100%); }
    button, textarea { font: inherit; }
    .topbar { display: flex; align-items: center; gap: 14px; min-height: 82px; padding: 16px max(24px, calc((100vw - 1160px) / 2)); border-bottom: 1px solid #29416c; background: #071638dd; }
    .brand-mark { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 12px; background: linear-gradient(135deg, #80e7f2, #40b9d3); color: #08203d; font-size: 23px; font-weight: 800; box-shadow: 0 5px 20px #39c3dc44; }
    .brand-title { font-size: 18px; font-weight: 750; letter-spacing: -.02em; }
    .brand-subtitle { margin-top: 2px; color: #b5c6e3; font-size: 13px; }
    main { width: min(100% - 40px, 980px); margin: 28px auto 64px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .tab, .sample, .secondary { border: 1px solid #355078; background: #081735; color: #e5efff; cursor: pointer; transition: .16s ease; }
    .tab { min-height: 42px; padding: 0 17px; border-radius: 12px; font-weight: 650; }
    .tab:hover, .sample:hover, .secondary:hover { border-color: #70d8eb; background: #10264d; }
    .tab.active { border-color: #78deed; background: linear-gradient(135deg, #85e9f2, #4ebdd9); color: #06203b; }
    .panel { padding: 24px; border: 1px solid #2a426b; border-radius: 18px; background: linear-gradient(140deg, #11234a, #0b1c3d 72%); box-shadow: 0 18px 45px #0003; }
    h1 { margin: 0 0 5px; font-size: 22px; letter-spacing: -.025em; }
    .intro { margin: 0 0 18px; color: #c0cfe7; font-size: 14px; line-height: 1.6; }
    textarea { display: block; width: 100%; min-height: 190px; resize: vertical; padding: 16px; border: 1px solid #5db9d2; border-radius: 13px; outline: none; background: #061330; color: #f2f6ff; line-height: 1.55; box-shadow: inset 0 0 0 1px #4bc5de25; }
    textarea:focus { border-color: #8ce6f2; box-shadow: 0 0 0 3px #52c9e533; }
    .samples, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 14px; }
    .samples-label { margin-right: 2px; color: #c0cfe7; font-size: 13px; }
    .sample, .secondary { min-height: 35px; padding: 0 12px; border-radius: 9px; font-size: 13px; }
    .primary { min-height: 43px; padding: 0 20px; border: 0; border-radius: 11px; background: linear-gradient(135deg, #82e6ef, #49b9d8); color: #06203b; font-weight: 750; cursor: pointer; }
    .primary:hover { filter: brightness(1.08); }
    .primary:disabled { cursor: wait; opacity: .7; }
    .result { display: none; align-items: center; gap: 18px; margin-top: 18px; padding: 17px 19px; border: 1px solid #36587a; border-radius: 14px; background: #102b49; }
    .result.visible { display: flex; }
    .result-label { min-width: 70px; font-size: 28px; font-weight: 850; letter-spacing: .03em; }
    .result-label.ham { color: #7fe4bd; }
    .result-label.spam { color: #ff9caa; }
    .result-detail { flex: 1; min-width: 100px; color: #d2dff0; font-size: 13px; }
    .meter { height: 7px; margin: 8px 0 5px; overflow: hidden; border-radius: 10px; background: #253d5c; }
    .meter-fill { width: 0; height: 100%; border-radius: inherit; background: #75dfb6; transition: width .3s ease; }
    .spam + .result-detail .meter-fill { background: #ff8f9f; }
    .route { white-space: nowrap; color: #c7d7ec; font-size: 13px; }
    .error { display: none; margin-top: 12px; color: #ff9eaa; font-size: 14px; }
    .error.visible { display: block; }
    .view-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .view-heading p { margin: 6px 0 0; color: #bdcce3; font-size: 14px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
    .stat { padding: 18px; border: 1px solid #304b72; border-radius: 13px; background: #0a1b3b; }
    .stat-label { color: #c0cfe7; font-size: 13px; }
    .stat-value { margin-top: 8px; font-size: 30px; font-weight: 800; }
    .email-list { display: grid; gap: 10px; }
    .email-card { padding: 15px 16px; border: 1px solid #304b72; border-radius: 12px; background: #091a38; }
    .email-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; color: #9fb4d2; font-size: 12px; }
    .email-body { color: #e3ecf9; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
    .empty { padding: 30px 16px; border: 1px dashed #3b5579; border-radius: 12px; color: #b6c6df; text-align: center; }
    .loading { color: #b6c6df; }
    @media (max-width: 600px) {
      main { width: min(100% - 24px, 980px); margin-top: 18px; }
      .topbar { padding-inline: 16px; }
      .panel { padding: 18px 15px; }
      .tab { padding-inline: 12px; }
      .result { align-items: flex-start; flex-wrap: wrap; gap: 8px 15px; }
      .result-detail { flex-basis: calc(100% - 90px); }
      .route { margin-left: 85px; }
      .stat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">P</div>
    <div>
      <div class="brand-title">Email Spam Detection</div>
      <div class="brand-subtitle">ProtIBridge · NLP Monitoring Dashboard</div>
    </div>
  </header>
  <main>
    <nav class="tabs" aria-label="Dashboard sections">
      <button class="tab active" data-view="classifier">Classifier</button>
      <button class="tab" data-view="overview">Overview</button>
      <button class="tab" data-view="quarantine">Quarantine</button>
      <button class="tab" data-view="inbox">Inbox</button>
    </nav>
    <section id="content" class="panel"></section>
  </main>
  <script>
    const content = document.querySelector("#content");
    const tabs = [...document.querySelectorAll(".tab")];
    const samples = {
      spam: "Congratulations! You have won a $1,000 gift card. Click here now to claim your prize!",
      ham: "Thank you for your support. Let me know if you need anything.",
      phishing: "URGENT: Your account will be suspended. Verify your password immediately at this link."
    };

    function setActiveTab(view) {
      tabs.forEach(tab => {
        const active = tab.dataset.view === view;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-current", active ? "page" : "false");
      });
    }

    function showClassifier() {
      content.innerHTML = `
        <h1>Classify an email</h1>
        <p class="intro">Paste an email below. It runs through the same clean → vectorize → model pipeline used in training. HAM is delivered to the inbox; SPAM is quarantined.</p>
        <textarea id="email-text" aria-label="Email text" placeholder="Paste the email text you want to classify..."></textarea>
        <div class="samples">
          <span class="samples-label">Try:</span>
          <button class="sample" data-sample="spam">Spam sample</button>
          <button class="sample" data-sample="ham">Ham sample</button>
          <button class="sample" data-sample="phishing">Phishing sample</button>
        </div>
        <div class="actions">
          <button id="classify" class="primary">Classify email</button>
          <button id="clear" class="secondary">Clear</button>
        </div>
        <div id="error" class="error" role="alert"></div>
        <div id="result" class="result" aria-live="polite">
          <div id="result-label" class="result-label"></div>
          <div class="result-detail">
            <div class="meter"><div id="meter-fill" class="meter-fill"></div></div>
            <span id="confidence"></span>
          </div>
          <div id="route" class="route"></div>
        </div>`;

      const textArea = document.querySelector("#email-text");
      document.querySelectorAll("[data-sample]").forEach(button => {
        button.addEventListener("click", () => { textArea.value = samples[button.dataset.sample]; });
      });
      document.querySelector("#clear").addEventListener("click", () => {
        textArea.value = "";
        document.querySelector("#result").classList.remove("visible");
        document.querySelector("#error").classList.remove("visible");
      });
      document.querySelector("#classify").addEventListener("click", async event => {
        const button = event.currentTarget;
        const error = document.querySelector("#error");
        const email = textArea.value.trim();
        error.classList.remove("visible");
        document.querySelector("#result").classList.remove("visible");
        if (!email) {
          error.textContent = "Enter an email before classifying.";
          error.classList.add("visible");
          return;
        }
        button.disabled = true;
        button.textContent = "Classifying...";
        try {
          const response = await fetch("/api/classify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: email })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || "Classification failed.");
          const confidence = Math.round(result.confidence * 100);
          const label = document.querySelector("#result-label");
          label.textContent = result.label.toUpperCase();
          label.className = `result-label ${result.label}`;
          document.querySelector("#meter-fill").style.width = `${confidence}%`;
          document.querySelector("#confidence").textContent = `${confidence}% confidence`;
          document.querySelector("#route").textContent = result.destination === "quarantine" ? "→ Quarantined" : "→ Delivered to inbox";
          document.querySelector("#result").classList.add("visible");
        } catch (requestError) {
          error.textContent = requestError.message;
          error.classList.add("visible");
        } finally {
          button.disabled = false;
          button.textContent = "Classify email";
        }
      });
    }

    async function showOverview() {
      content.innerHTML = `<div class="view-heading"><div><h1>Overview</h1><p>Classification activity across your folders.</p></div></div><div class="loading">Loading overview...</div>`;
      try {
        const response = await fetch("/api/overview");
        if (!response.ok) throw new Error("Could not load overview.");
        const stats = await response.json();
        content.innerHTML = `
          <div class="view-heading"><div><h1>Overview</h1><p>Classification activity across your folders.</p></div></div>
          <div class="stat-grid">
            <div class="stat"><div class="stat-label">Total classified</div><div class="stat-value">${stats.total}</div></div>
            <div class="stat"><div class="stat-label">Inbox · HAM</div><div class="stat-value">${stats.inbox}</div></div>
            <div class="stat"><div class="stat-label">Quarantine · SPAM</div><div class="stat-value">${stats.quarantine}</div></div>
          </div>`;
      } catch (error) {
        content.innerHTML = `<h1>Overview</h1><p class="error visible">${error.message}</p>`;
      }
    }

    async function showFolder(folder) {
      const title = folder === "inbox" ? "Inbox" : "Quarantine";
      content.innerHTML = `<div class="view-heading"><div><h1>${title}</h1><p>${folder === "inbox" ? "Emails classified as HAM and delivered safely." : "Emails classified as SPAM and held for review."}</p></div></div><div class="loading">Loading emails...</div>`;
      try {
        const response = await fetch(`/api/emails/${folder}`);
        if (!response.ok) throw new Error(`Could not load ${folder}.`);
        const emails = await response.json();
        const list = document.createElement("div");
        list.className = "email-list";
        if (!emails.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = `No emails in ${folder} yet.`;
          list.append(empty);
        } else {
          emails.forEach(email => {
            const card = document.createElement("article");
            card.className = "email-card";
            const meta = document.createElement("div");
            meta.className = "email-meta";
            const label = document.createElement("span");
            label.textContent = email.label.toUpperCase();
            const timestamp = document.createElement("time");
            timestamp.dateTime = email.timestamp;
            timestamp.textContent = new Date(email.timestamp).toLocaleString();
            const body = document.createElement("div");
            body.className = "email-body";
            body.textContent = email.email_text;
            meta.append(label, timestamp);
            card.append(meta, body);
            list.append(card);
          });
        }
        content.replaceChildren();
        const heading = document.createElement("div");
        heading.className = "view-heading";
        const headingText = document.createElement("div");
        const headingTitle = document.createElement("h1");
        headingTitle.textContent = title;
        const description = document.createElement("p");
        description.textContent = folder === "inbox" ? "Emails classified as HAM and delivered safely." : "Emails classified as SPAM and held for review.";
        headingText.append(headingTitle, description);
        heading.append(headingText);
        content.append(heading, list);
      } catch (error) {
        content.innerHTML = `<h1>${title}</h1><p class="error visible">${error.message}</p>`;
      }
    }

    const views = { classifier: showClassifier, overview: showOverview, quarantine: () => showFolder("quarantine"), inbox: () => showFolder("inbox") };
    tabs.forEach(tab => tab.addEventListener("click", () => {
      setActiveTab(tab.dataset.view);
      views[tab.dataset.view]();
    }));
    showClassifier();
  </script>
</body>
</html>
